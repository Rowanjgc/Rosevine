name: Guardrails
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner and local hooks
        run: ./scripts/bootstrap.sh
      - name: Check repository and guardrail tests
        run: ./scripts/check.sh

name: Guardrails
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner and local hooks
        run: ./scripts/bootstrap.sh
      - name: Check repository and guardrail tests
        run: ./scripts/check.sh
